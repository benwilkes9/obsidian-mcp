# SonarCloud Configuration
# https://docs.sonarcloud.io/advanced-setup/analysis-parameters/

# Project identification
sonar.projectKey=benwilkes9_obsidian-mcp
sonar.organization=benwilkes9

# Project metadata
sonar.projectName=obsidian-mcp
sonar.projectVersion=0.1.0

# Source code
sonar.sources=src
sonar.tests=src/__tests__,src/tools
sonar.test.inclusions=**/*.test.ts

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.test.ts
sonar.coverage.exclusions=**/*.test.ts,**/src/__tests__/**

# Coverage
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Source encoding
sonar.sourceEncoding=UTF-8

# Test coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
